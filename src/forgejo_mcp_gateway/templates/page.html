<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
:root {
  color-scheme: light dark;
  --fg: #1d1d1f; --muted: #5f6368; --bg: #f6f7f9; --card: #fff;
  --line: #d9dce1; --accent: #c2410c; --err: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #ececf1; --muted: #a1a1aa; --bg: #16171a; --card: #1f2024;
    --line: #34363c; --accent: #fb923c; --err: #f97066;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main {
  width: 100%; max-width: 440px; padding: 28px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
}
h1 { font-size: 1.25rem; margin: 0 0 8px; }
p { margin: 0 0 16px; color: var(--muted); }
ol { margin: 0 0 20px; padding-left: 20px; color: var(--muted); }
li { margin-bottom: 6px; }
a { color: var(--accent); }
label { display: block; font-weight: 600; margin-bottom: 6px; }
input[type=password] {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--fg);
  background: transparent; border: 1px solid var(--line); border-radius: 8px;
}
.error { color: var(--err); margin: 8px 0 0; }
.actions { display: flex; flex-direction: row-reverse; gap: 12px; margin-top: 20px; }
/* Connect comes first in the markup so Enter submits it; it is shown on the right. */
button {
  flex: 1; padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer;
  color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px;
}
button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
code { font-size: .9em; }
</style>
</head>
<body><main>
$body
</main></body>
</html>
